<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Estoque — Pedidos Urgentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="brand-mark">SB</div>
    <div>
      <h1>Pedidos Urgentes</h1>
      <div class="sub">Painel — Estoque · atualiza a cada 15s</div>
    </div>
  </div>
  <nav>
    <a href="cadastro.html">Cadastrar</a>
    <a href="painel.html" class="active">Painel Estoque</a>
    <a href="historico.html">Histórico</a>
  </nav>
</div>

<div class="container">
  <button id="btnAtivarSom" onclick="ativarSom()" style="margin-bottom:16px; background:var(--surface-alt); color:var(--text); border:1px solid var(--border);">🔔 Clique aqui pra ativar o som de alerta</button>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">-</div><div class="l">pedidos na fila</div></div>
    <div class="stat danger"><div class="n" id="statAtrasado">-</div><div class="l">atrasados</div></div>
    <div class="stat ok"><div class="n" id="statNoPrazo">-</div><div class="l">dentro do prazo</div></div>
  </div>

  <div id="lista"></div>
</div>

<div id="lightbox" class="lightbox" onclick="fecharImagem()">
  <img id="lightboxImg" src="" alt="OS ampliada">
</div>

<audio id="somAlerta" src="alerta.mp3" preload="auto"></audio>

<script src="config.js"></script>
<script>
let idsConhecidos = new Set();
let primeiraCarga = true;

function ativarSom() {
  const audio = document.getElementById('somAlerta');
  audio.play().then(() => {
    audio.pause();
    audio.currentTime = 0;
    document.getElementById('btnAtivarSom').textContent = '✓ Som ativado';
    document.getElementById('btnAtivarSom').disabled = true;
  }).catch(() => {
    document.getElementById('btnAtivarSom').textContent = 'Não foi possível ativar — clique em qualquer lugar da página';
  });
}

function tocarAlerta() {
  const audio = document.getElementById('somAlerta');
  audio.currentTime = 0;
  audio.play().catch(() => {
    // navegador pode bloquear autoplay até o usuário interagir com a página uma vez
  });
}

function formatarHora(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function urgencia(prazoIso) {
  const prazo = new Date(prazoIso);
  const diffMin = (prazo - new Date()) / 60000;
  if (diffMin < 0) return 'danger';
  if (diffMin < 120) return 'warn';
  return 'ok';
}

function rotuloUrgencia(prazoIso) {
  const prazo = new Date(prazoIso);
  const diffMin = Math.round((prazo - new Date()) / 60000);
  if (diffMin < 0) return `Atrasado ${Math.abs(diffMin)} min`;
  if (diffMin < 120) return `Faltam ${diffMin} min`;
  return `No prazo`;
}

function abrirImagem(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('aberto');
}

function fecharImagem() {
  document.getElementById('lightbox').classList.remove('aberto');
  document.getElementById('lightboxImg').src = '';
}

async function despachar(id, os) {
  const nome = prompt(`Confirmar despacho do pedido ${os}.\nSeu nome:`);
  if (!nome) return;
  try {
    const resp = await fetch(APP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'despachar', id, despachadoPor: nome })
    });
    const data = await resp.json();
    if (data.ok) {
      idsConhecidos.delete(id);
      carregar();
    } else {
      alert('Erro: ' + (data.erro || 'não foi possível despachar'));
    }
  } catch (e) {
    alert('Erro de conexão ao despachar.');
  }
}

async function carregar() {
  try {
    const resp = await fetch(`${APP_URL}?action=list&status=Pendente`);
    const pedidos = await resp.json();

    pedidos.sort((a, b) => new Date(a.Prazo) - new Date(b.Prazo));

    const idsAtuais = new Set(pedidos.map(p => p.ID));
    if (!primeiraCarga) {
      const novos = [...idsAtuais].filter(id => !idsConhecidos.has(id));
      if (novos.length > 0) tocarAlerta();
    }
    idsConhecidos = idsAtuais;
    primeiraCarga = false;

    const atrasados = pedidos.filter(p => urgencia(p.Prazo) === 'danger').length;
    document.getElementById('statTotal').textContent = pedidos.length;
    document.getElementById('statAtrasado').textContent = atrasados;
    document.getElementById('statNoPrazo').textContent = pedidos.length - atrasados;

    const lista = document.getElementById('lista');
    if (pedidos.length === 0) {
      lista.innerHTML = `<div class="empty"><div class="big">✓</div>Nenhum pedido pendente agora.</div>`;
      return;
    }

    lista.innerHTML = pedidos.map(p => {
      const u = urgencia(p.Prazo);
      return `
        <div class="pedido ${u}">
          <div class="pedido-top">
            <div>
              <div class="pedido-os mono">${p.OS}</div>
              <div class="pedido-cliente">${p.Cliente}</div>
            </div>
            <span class="badge ${u}">${rotuloUrgencia(p.Prazo)}</span>
          </div>
          <div class="pedido-meta">
            <div><div class="k">Prazo</div>${formatarHora(p.Prazo)}</div>
            <div><div class="k">Transportadora</div>${p.Transportadora}</div>
            <div><div class="k">Modalidade</div>${p.Modalidade}</div>
            ${p.TipoEnvioAereo ? `<div><div class="k">Envio aéreo</div>${p.TipoEnvioAereo}${p.AeroportoRetirada ? ' — ' + p.AeroportoRetirada : ''}</div>` : ''}
            <div><div class="k">CRM</div><a href="${p.LinkCRM}" target="_blank">Abrir pedido →</a></div>
            ${p.ManifestoLink ? `<div><div class="k">Manifesto</div><a href="${p.ManifestoLink}" target="_blank">Ver PDF →</a></div>` : ''}
            ${p.NotaFiscalLink ? `<div><div class="k">Nota fiscal</div><a href="${p.NotaFiscalLink}" target="_blank">Ver PDF →</a></div>` : ''}
            <div><div class="k">Inserido por</div>${p.InseridoPor}</div>
          </div>
          ${p.OSImagemId ? `
            <img class="os-thumb" src="https://drive.google.com/thumbnail?id=${p.OSImagemId}&sz=w300"
                 alt="Foto da OS ${p.OS}"
                 onclick="abrirImagem('https://drive.google.com/thumbnail?id=${p.OSImagemId}&sz=w1600')">
          ` : ''}
          <div class="pedido-actions">
            <button class="btn-dispatch" onclick="despachar('${p.ID}', '${p.OS}')">Despachar</button>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('lista').innerHTML = `<div class="empty">Erro ao carregar. Confira a URL em config.js.</div>`;
  }
}

carregar();
setInterval(carregar, 15000);
</script>

</body>
</html>
